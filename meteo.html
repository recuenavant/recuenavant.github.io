<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Locale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .suggestions {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .suggestion {
            background-color: #e0e0e0;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .suggestion:hover {
            background-color: #c0c0c0;
        }
        .weather-info {
            display: none;
            margin-top: 20px;
        }
        .weather-info.active {
            display: block;
        }
        .weather-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            display: block;
        }
        .weather-details {
            margin-top: 20px;
        }
        .weather-details p {
            margin: 5px 0;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .geo-button {
            background-color: #2196F3;
            margin-top: 10px;
        }
        .geo-button:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>
    <h1>Météo Locale</h1>
    <div class="container">
        <div class="input-group">
            <input type="text" id="cityInput" placeholder="Entrez le nom d'une ville">
            <div class="suggestions" id="suggestions">
                <div class="suggestion" onclick="setCity('Paris')">Paris</div>
                <div class="suggestion" onclick="setCity('Lyon')">Lyon</div>
                <div class="suggestion" onclick="setCity('Marseille')">Marseille</div>
                <div class="suggestion" onclick="setCity('Toulouse')">Toulouse</div>
                <div class="suggestion" onclick="setCity('Nice')">Nice</div>
                <div class="suggestion" onclick="setCity('Bordeaux')">Bordeaux</div>
                <div class="suggestion" onclick="setCity('Strasbourg')">Strasbourg</div>
                <div class="suggestion" onclick="setCity('Montpellier')">Montpellier</div>
                <div class="suggestion" onclick="setCity('Nantes')">Nantes</div>
                <div class="suggestion" onclick="setCity('Lille')">Lille</div>
            </div>
            <button id="searchButton">Rechercher</button>
            <button id="geoButton" class="geo-button">Utiliser ma position</button>
        </div>
        <div id="error" class="error"></div>
        <div id="weatherInfo" class="weather-info">
            <h2 id="cityName"></h2>
            <img id="weatherIcon" class="weather-icon" src="" alt="Icône météo">
            <div class="weather-details">
                <p><strong>Température:</strong> <span id="temperature"></span>°C</p>
                <p><strong>Humidité:</strong> <span id="humidity"></span>%</p>
                <p><strong>Vent:</strong> <span id="windSpeed"></span> km/h</p>
                <p><strong>Conditions:</strong> <span id="weatherCondition"></span></p>
                <p><strong>Lever du soleil:</strong> <span id="sunrise"></span></p>
                <p><strong>Coucher du soleil:</strong> <span id="sunset"></span></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchButton = document.getElementById('searchButton');
            const cityInput = document.getElementById('cityInput');
            const weatherInfo = document.getElementById('weatherInfo');
            const errorElement = document.getElementById('error');
            const geoButton = document.getElementById('geoButton');

            // Remplacez par votre clé API OpenWeatherMap
            const apiKey = 'e189c60897266f198e7b4de6f51c0b6d';

            searchButton.addEventListener('click', function() {
                const city = cityInput.value.trim();
                if (city) {
                    fetchWeather(city);
                } else {
                    errorElement.textContent = 'Veuillez entrer un nom de ville';
                }
            });

            geoButton.addEventListener('click', function() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            fetchWeatherByCoords(lat, lon);
                        },
                        function(error) {
                            errorElement.textContent = 'Impossible d\'obtenir votre position';
                        }
                    );
                } else {
                    errorElement.textContent = 'La géolocalisation n\'est pas disponible dans votre navigateur';
                }
            });

            function setCity(city) {
                cityInput.value = city;
                fetchWeather(city);
            }

            function fetchWeather(city) {
                errorElement.textContent = '';
                weatherInfo.classList.remove('active');

                const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city},FR&units=metric&lang=fr&appid=${apiKey}`;

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            if (response.status === 404) {
                                throw new Error('Ville non trouvée en France. Vérifiez l\'orthographe ou essayez une autre ville.');
                            } else {
                                throw new Error('Erreur de connexion à l\'API.');
                            }
                        }
                        return response.json();
                    })
                    .then(data => {
                        displayWeather(data);
                    })
                    .catch(error => {
                        errorElement.textContent = error.message;
                    });
            }

            function fetchWeatherByCoords(lat, lon) {
                errorElement.textContent = '';
                weatherInfo.classList.remove('active');

                const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=fr&appid=${apiKey}`;

                fetch(apiUrl)
                    .then(response => response.json())
                    .then(data => {
                        displayWeather(data);
                    })
                    .catch(error => {
                        errorElement.textContent = 'Impossible d\'obtenir la météo pour votre position';
                    });
            }

            function displayWeather(data) {
                const cityName = document.getElementById('cityName');
                const temperature = document.getElementById('temperature');
                const humidity = document.getElementById('humidity');
                const windSpeed = document.getElementById('windSpeed');
                const weatherCondition = document.getElementById('weatherCondition');
                const weatherIcon = document.getElementById('weatherIcon');
                const sunrise = document.getElementById('sunrise');
                const sunset = document.getElementById('sunset');

                cityName.textContent = `${data.name}, ${data.sys.country}`;

                // Convertir les timestamps en heures locales
                const sunriseTime = new Date(data.sys.sunrise * 1000).toLocaleTimeString();
                const sunsetTime = new Date(data.sys.sunset * 1000).toLocaleTimeString();

                temperature.textContent = Math.round(data.main.temp);
                humidity.textContent = data.main.humidity;
                windSpeed.textContent = Math.round(data.wind.speed * 3.6); // Convertir m/s en km/h
                weatherCondition.textContent = data.weather[0].description;
                sunrise.textContent = sunriseTime;
                sunset.textContent = sunsetTime;

                // Afficher l'icône météo
                const iconCode = data.weather[0].icon;
                weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

                weatherInfo.classList.add('active');
            }
        });
    </script>
</body>
</html>
